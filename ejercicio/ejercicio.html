<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@v0.155.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
    }
  }
</script>
</head>

<body>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script type="module">

    import * as THREE from 'three';

    var rotarY = 10.0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    //esto es lo del cubo q ya esta
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });    const cube = new THREE.Mesh(geometry, material);

    scene.add(cube)

    // Esfera 
    const geometry2 = new THREE.SphereGeometry(1);
    const material2 = new THREE.MeshPhongMaterial({ color: 0x800080 });    const sphere = new THREE.Mesh(geometry2, material2);

    sphere.position.x = -10;
    scene.add(sphere);


    // Cono 
    const geometry3 = new THREE.ConeGeometry(1, 2);
    const material3 = new THREE.MeshPhongMaterial({ color: 0xffffff });    const cone = new THREE.Mesh(geometry3, material3);

    cone.position.x = 2;
    scene.add(cone);


    // Luz
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); //color blanco,intensidad
      scene.add(ambientLight);

      // Luz direccional
      const directionalLight = new THREE.DirectionalLight(0xffff00, 1);
      directionalLight.position.set(5, 5, 5);
      scene.add(directionalLight);

      // Luz puntual
      const pointLight = new THREE.PointLight(0xff00ff, 2);
      scene.add(pointLight);

      camera.position.z =8;
      camera.position.y = 2.5;

      var posicionCubo = new THREE.Vector3(0, 0.2, -1);

      renderer.setAnimationLoop(animate);

      let direccion = 1;


        function animate() {

          sphere.position.x += 0.02 * direccion;

          if (sphere.position.x >= 10) {
            direccion = -1;
          }

          if (sphere.position.x <= -10) {
            direccion = 1;
          }

          pointLight.position.copy(sphere.position);

          renderer.render(scene, camera);

        }


        document.addEventListener('keydown', (event) => {

          if (event.key === 'a') {
            cube.position.x -= 1;
          }
          if (event.key === 'd') {
            cube.position.x += 1;
          }
          if (event.key === 'w') {
            cube.position.z -= 1;
          }
          if (event.key === 's') {
            cube.position.z += 1;
          }

        });


  </script>
</body>

</html>
