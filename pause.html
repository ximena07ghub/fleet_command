<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fleet Command | Pausa</title>

    <link rel="stylesheet" href="css/pause.css">
</head>

<body>

    <main class="pantalla-pausa">

        <!-- Fondo desenfocado -->
        <div class="fondo-pausa"></div>

        <!-- Capa oscura -->
        <div class="capa-oscura"></div>

        <!-- Contenido centrado -->
        <section class="contenedor-pausa">

            <!-- Logo superior -->
            <img
                src="assets/img/logo.png"
                alt="Fleet Command"
                class="logo-pausa"
            >

            <!-- Panel de pausa -->
            <div class="panel-pausa">

                <!-- Esquinas HUD -->
                <span class="esquina esquina-tl"></span>
                <span class="esquina esquina-tr"></span>
                <span class="esquina esquina-bl"></span>
                <span class="esquina esquina-br"></span>

                <!-- Titulo de pausa -->
                <div class="encabezado-pausa">

                    <p class="kicker">
                        PARTIDA EN CURSO
                    </p>

                    <h1>
                        PAUSA
                    </h1>

                    <div class="linea-titulo"></div>

                </div>


                <!-- Opciones de pausa -->
                <nav class="menu-pausa">

                    <button
                        class="boton-pausa seleccionado"
                        data-accion="continuar"
                    >

                    
                        <span>
                            CONTINUAR
                        </span>

                    </button>


                    <button
                        class="boton-pausa"
                        data-accion="reiniciar"
                    >

                

                        <span>
                            REINICIAR PARTIDA
                        </span>

                    </button>


                    <button
                        class="boton-pausa"
                        data-accion="ajustes"
                    >

                      

                        <span>
                            AJUSTES
                        </span>

                    </button>


                    <button
                        class="boton-pausa peligro"
                        data-accion="salir"
                    >

                  

                        <span>
                            SALIR AL MENÚ
                        </span>

                    </button>

                </nav>


                <!-- Estado del sistema -->
                <div class="estado-pausa">

                    <span class="estado-punto"></span>

                    <span>
                        SISTEMA EN ESPERA
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- Logica de pausa -->
    <script src="js/pause.js"></script>

</body>

</html>
